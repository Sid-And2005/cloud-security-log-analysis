# Local stand-ins for the Azure services, for development and integration tests:
#   PostgreSQL 16 (Azure Database for PostgreSQL) and Azurite (Azure Blob Storage).
# Usage: docker compose up -d   then use the settings in .env.example ("cloud emulation").
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seclog
      POSTGRES_PASSWORD: localdev   # local-only throwaway credential
      POSTGRES_DB: seclog
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "seclog"]
      interval: 2s
      retries: 30
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["127.0.0.1:10000:10000"]
    volumes: ["azuritedata:/data"]

volumes:
  pgdata:
  azuritedata:
