name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests (unit + PostgreSQL/Azurite integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seclog
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: seclog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seclog"
          --health-interval 2s
          --health-retries 30

    env:
      # Local emulators only; no Azure credentials are needed for CI.
      TEST_DATABASE_URL: postgresql://seclog:ci-only-throwaway@127.0.0.1:5432/seclog
      TEST_AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

    steps:
      - uses: actions/checkout@v7

      - name: Start Azurite (Blob Storage emulator)
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax / compile check
        run: python -m compileall -q src tests ./*.py

      - name: Validate model bundle and feature schema
        run: python manage.py check-model

      - name: Run tests
        run: python -m pytest -v -rs

      - name: Synthetic detection evaluation
        run: python eval.py --json evaluation_results.json

      - uses: actions/upload-artifact@v7
        with:
          name: evaluation-results
          path: evaluation_results.json

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  shell:
    name: ShellCheck deployment scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh scripts/*.sh
